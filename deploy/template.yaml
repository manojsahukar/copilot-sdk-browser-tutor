AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Browser Tutor PoC — Copilot SDK agent on Lambda (zip) + Lambda Web Adapter + Function URL (response streaming), locked behind CloudFront

Parameters:
  GitHubOAuthSecretArn:
    Type: String
    Description: >-
      Secrets Manager secret ARN. JSON {client_id, client_secret, session_secret, origin_verify}.
      Read at runtime; NO secret is placed in Lambda env vars. (No default: pass your own ARN.)
  OriginVerify:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Shared secret CloudFront injects as X-Origin-Verify so the origin rejects direct Function-URL hits. Must equal origin_verify in the secret JSON.
  OriginVerifyEnforce:
    Type: String
    Default: "1"
    AllowedValues: ["0", "1"]
    Description: "Staged rollout flag. 1 = origin rejects requests lacking X-Origin-Verify. Set 0 for the first deploy so CloudFront's header propagates, then 1."
  AllowedLogins: { Type: String, Default: "" }
  BaseUrl:
    Type: String
    Default: ""
    Description: "Public site URL, e.g. https://tutor.example.com (empty on first deploy, before the URL/domain is known)"

  DomainName: { Type: String, Default: "", Description: "Main custom domain, e.g. tutor.example.com (empty = no CloudFront)" }
  CertificateArn: { Type: String, Default: "", Description: "ACM cert in us-east-1 for DomainName and SiblingDomainName (deploy/cert-template.yaml)" }
  HostedZoneId: { Type: String, Default: "", Description: "Route 53 hosted zone id for the records (empty = manage DNS yourself)" }
  SiblingDomainName: { Type: String, Default: "", Description: "Second origin for cross-site demos, e.g. sibling.example.com" }
  SiblingCertificateArn: { Type: String, Default: "", Description: "ACM cert in us-east-1 for SiblingDomainName" }
  CookieDomain: { Type: String, Default: "", Description: "Parent domain shared by both sites, e.g. example.com, for the cross-site cookie demo" }
  LabDomainName: { Type: String, Default: "", Description: "Isolated XSS-lab origin, e.g. xss-lab.example.com" }
  LabCertificateArn: { Type: String, Default: "", Description: "ACM cert in us-east-1 for LabDomainName" }
  # Observability: CloudFront distribution ids can't be !Ref'd from the function (Function -> Distribution -> FunctionUrl
  # -> Function would be a cycle), so deploy.sh looks them up from this stack and passes them in.
  MainDistributionId: { Type: String, Default: "" }
  SiblingDistributionId: { Type: String, Default: "" }
  LabDistributionId: { Type: String, Default: "" }
  ObsAdminLogins: { Type: String, Default: "", Description: "GitHub logins allowed to see site-wide row-level logs (masked)" }

Conditions:
  HasBaseUrl: !Not [!Equals [!Ref BaseUrl, ""]]
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasSibling: !Not [!Equals [!Ref SiblingDomainName, ""]]
  HasZone: !Not [!Equals [!Ref HostedZoneId, ""]]
  MainDns: !And [!Condition HasDomain, !Condition HasZone]
  SiblingDns: !And [!Condition HasSibling, !Condition HasZone]
  HasLab: !Not [!Equals [!Ref LabDomainName, ""]]
  LabDns: !And [!Condition HasLab, !Condition HasZone]

Resources:
  TutorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: browser-tutor
      CodeUri: ../dist/browser-tutor.zip
      Handler: run.sh
      Runtime: nodejs22.x
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 120
      ReservedConcurrentExecutions: 5
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:30
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          AWS_LWA_PORT: "8080"
          AWS_LWA_READINESS_CHECK_PATH: /healthz
          PORT: "8080"
          HOST: 127.0.0.1
          HOME: /tmp
          COPILOT_HOME_DIR: /tmp/copilot
          NODE_ENV: production
          TRUST_PROXY: "1"
          GITHUB_OAUTH_SECRET_ARN: !Ref GitHubOAuthSecretArn    # client id/secret, session_secret, origin_verify all live here
          ORIGIN_VERIFY_ENFORCE: !Ref OriginVerifyEnforce
          ALLOWED_LOGINS: !Ref AllowedLogins
          BASE_URL: !If [HasBaseUrl, !Ref BaseUrl, "https://placeholder.invalid"]
          SIBLING_HOST: !If [HasSibling, !Ref SiblingDomainName, ""]
          SIBLING_URL: !If [HasSibling, !Sub "https://${SiblingDomainName}", ""]
          COOKIE_DOMAIN: !Ref CookieDomain
          LAB_HOST: !If [HasLab, !Ref LabDomainName, ""]
          LAB_URL: !If [HasLab, !Sub "https://${LabDomainName}", ""]
          METRICS_TABLE: !Ref MetricsTable
          METRICS_FUNCTION_NAME: browser-tutor
          METRICS_LOG_GROUP: /aws/lambda/browser-tutor
          CF_DIST_MAIN: !Ref MainDistributionId
          CF_DIST_SIBLING: !Ref SiblingDistributionId
          CF_DIST_LAB: !Ref LabDistributionId
          OBS_ADMIN_LOGINS: !Ref ObsAdminLogins
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref GitHubOAuthSecretArn
        # ---- Observability: READ-ONLY (plus PutItem for the app's own minimised telemetry). No write/describe on anything else. ----
        - Version: "2012-10-17"
          Statement:
            - Sid: TelemetryTableOnly
              Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:Query]
              Resource: !GetAtt MetricsTable.Arn
            - Sid: ReadMetricsNoResourceLevelSupport   # GetMetricData can't be scoped to metrics; the app's fixed catalogue picks namespace/dimensions
              Effect: Allow
              Action: cloudwatch:GetMetricData
              Resource: "*"
            - Sid: LogsInsightsOwnLogGroupOnly    # queries can only START against the tutor's own log group
              Effect: Allow
              Action: logs:StartQuery
              Resource:
                - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/browser-tutor
                - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/browser-tutor:*
            - Sid: LogsQueryResultsByIdNoResourceLevelSupport  # acts on a queryId, which only the scoped StartQuery yields
              Effect: Allow
              Action: logs:GetQueryResults
              Resource: "*"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  TutorLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/browser-tutor
      RetentionInDays: 7

  # Telemetry + health history. On-demand (no idle cost), TTL deletes rows after 30-35 days (free), AWS-owned encryption (free).
  MetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: browser-tutor-metrics
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  # Availability pinger: EventBridge schedule (free) -> tiny arm64 Lambda every 5 min -> one row in MetricsTable.
  PingerFunction:
    Type: AWS::Serverless::Function
    Condition: HasDomain
    Properties:
      FunctionName: browser-tutor-pinger
      CodeUri: pinger/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 25
      Environment:
        Variables:
          METRICS_TABLE: !Ref MetricsTable
          TARGETS: !Sub
            - '{"main":"https://${DomainName}/healthz","ready":"https://${DomainName}/readyz"${Sib}${Lab}}'
            - Sib: !If [HasSibling, !Sub ',"sibling":"https://${SiblingDomainName}/healthz"', ""]
              Lab: !If [HasLab, !Sub ',"lab":"https://${LabDomainName}/healthz"', ""]
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: WriteProbeRowsOnly
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt MetricsTable.Arn
      Events:
        Every5Min:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Description: Browser Tutor availability probe

  PingerLogs:
    Type: AWS::Logs::LogGroup
    Condition: HasDomain
    Properties:
      LogGroupName: /aws/lambda/browser-tutor-pinger
      RetentionInDays: 7

  # ---------- Shared CloudFront bits ----------
  ViewerHeadersFunction:
    Type: AWS::CloudFront::Function
    Condition: HasDomain
    Properties:
      Name: browser-tutor-viewer-headers
      AutoPublish: true
      FunctionConfig:
        Comment: Bundle viewer request headers into one header (origin request policies allow only 10 named headers)
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var r = event.request, h = r.headers, out = {};
          for (var k in h) {
            if (k === 'cookie' || k === 'host' || k === 'x-origin-verify' || k.indexOf('x-bt-') === 0) continue;
            var v = h[k];
            out[k] = v.multiValue ? v.multiValue.map(function (x) { return x.value; }).join(', ') : v.value;
          }
          r.headers['x-bt-viewer-headers'] = { value: encodeURIComponent(JSON.stringify(out)) };
          return r;
        }

  OriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Condition: HasDomain
    Properties:
      OriginRequestPolicyConfig:
        Name: browser-tutor-origin
        Comment: Viewer facts for Browser Tutor; Host is NOT forwarded (Function URL needs its own host)
        CookiesConfig: { CookieBehavior: all }
        QueryStringsConfig: { QueryStringBehavior: all }
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - CloudFront-Viewer-Address
            - CloudFront-Viewer-Http-Version
            - CloudFront-Viewer-TLS
            - CloudFront-Viewer-Country
            - CloudFront-Viewer-City
            - Origin
            - User-Agent
            - Accept-Language
            - Content-Type
            - x-bt-viewer-headers

  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasDomain
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: browser-tutor PoC (main)
        Aliases: [!Ref DomainName]
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: fnurl
            DomainName: !Select [2, !Split ["/", !GetAtt TutorFunctionUrl.FunctionUrl]]
            OriginCustomHeaders:
              - { HeaderName: X-Origin-Verify, HeaderValue: !Ref OriginVerify }   # gotcha 9: only CloudFront can reach the origin
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: fnurl
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: false
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled
          OriginRequestPolicyId: !Ref OriginRequestPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ViewerHeadersFunction.FunctionMetadata.FunctionARN

  SiblingDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasSibling
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: browser-tutor PoC (sibling origin for cross-site demos)
        Aliases: [!Ref SiblingDomainName]
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        ViewerCertificate:
          AcmCertificateArn: !Ref SiblingCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: fnurl
            DomainName: !Select [2, !Split ["/", !GetAtt TutorFunctionUrl.FunctionUrl]]
            OriginCustomHeaders:
              - { HeaderName: X-Origin-Verify, HeaderValue: !Ref OriginVerify }
              - { HeaderName: X-BT-Site, HeaderValue: sibling }
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: fnurl
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: false
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: !Ref OriginRequestPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ViewerHeadersFunction.FunctionMetadata.FunctionARN

  LabDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasLab
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: browser-tutor PoC (isolated XSS lab origin)
        Aliases: [!Ref LabDomainName]
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        ViewerCertificate:
          AcmCertificateArn: !Ref LabCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: fnurl
            DomainName: !Select [2, !Split ["/", !GetAtt TutorFunctionUrl.FunctionUrl]]
            OriginCustomHeaders:
              - { HeaderName: X-Origin-Verify, HeaderValue: !Ref OriginVerify }
              - { HeaderName: X-BT-Site, HeaderValue: xss-lab }
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: fnurl
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: false
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: !Ref OriginRequestPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ViewerHeadersFunction.FunctionMetadata.FunctionARN

  DnsA:
    Type: AWS::Route53::RecordSet
    Condition: MainDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
  DnsAAAA:
    Type: AWS::Route53::RecordSet
    Condition: MainDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
  SiblingDnsA:
    Type: AWS::Route53::RecordSet
    Condition: SiblingDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiblingDomainName
      Type: A
      AliasTarget: { DNSName: !GetAtt SiblingDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
  SiblingDnsAAAA:
    Type: AWS::Route53::RecordSet
    Condition: SiblingDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiblingDomainName
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt SiblingDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

  LabDnsA:
    Type: AWS::Route53::RecordSet
    Condition: LabDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref LabDomainName
      Type: A
      AliasTarget: { DNSName: !GetAtt LabDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
  LabDnsAAAA:
    Type: AWS::Route53::RecordSet
    Condition: LabDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref LabDomainName
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt LabDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

Outputs:
  MetricsTableName:
    Value: !Ref MetricsTable
  FunctionUrl:
    Value: !GetAtt TutorFunctionUrl.FunctionUrl
  OAuthCallbackUrl:
    Value: !If [HasDomain, !Sub "https://${DomainName}/auth/callback", !Sub "${TutorFunctionUrl.FunctionUrl}auth/callback"]
  SiteUrl:
    Condition: HasDomain
    Value: !Sub "https://${DomainName}"
  SiblingUrl:
    Condition: HasSibling
    Value: !Sub "https://${SiblingDomainName}"
  LabUrl:
    Condition: HasLab
    Value: !Sub "https://${LabDomainName}"
